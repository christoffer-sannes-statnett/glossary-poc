name: New term — open PR

on:
  issues:
    types: [labeled]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  open-pr:
    if: github.event.label.name == 'new-term'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Parse issue form and create term file
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          # GITHUB_TOKEN is used here for simplicity (PoC).
          # Limitation: the validate.yml check will NOT auto-trigger on the
          # auto-created PR — a reviewer must push a change or run it manually.
          # To fix this for production, replace with a GitHub App token:
          #   https://github.com/actions/create-github-app-token
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install rdflib -q
          python3 - <<'PYEOF'
          import os, re, subprocess, sys

          body    = os.environ["ISSUE_BODY"]
          issue_n = os.environ["ISSUE_NUMBER"]

          def field(label):
              """Extract the value below a ### Label heading in a GitHub issue form."""
              pattern = rf"###\s+{re.escape(label)}\s*\n+(.*?)(?=\n###|\Z)"
              m = re.search(pattern, body, re.DOTALL)
              val = m.group(1).strip() if m else ""
              return val if val and val != "_No response_" else ""

          slug           = field("Slug").upper().replace(" ", "_")
          en             = field("Engelsk navn") or field("English label")
          no             = field("Bokmål") or field("Norwegian Bokmål label")
          nn             = field("Nynorsk") or field("Norwegian Nynorsk label")
          description_no = field("Beskrivelse (norsk bokmål)")
          description_en = field("Beskrivelse (engelsk)") or field("Description (English)")
          parents_raw    = field("Overordnede begrep (valgfritt)")
          parents        = [p.strip().upper() for p in parents_raw.split(",") if p.strip()] if parents_raw else []

          if not slug or not en or not no:
              print("ERROR: slug, English label, and Bokmål are required.", file=sys.stderr)
              sys.exit(1)

          slug_pattern = re.compile(r'^[A-Z][A-Z0-9_]*$')
          if not slug_pattern.match(slug):
              print(f"ERROR: slug '{slug}' is not valid SCREAMING_SNAKE_CASE.", file=sys.stderr)
              sys.exit(1)

          term_path = f"terms/{slug}.ttl"
          if os.path.exists(term_path):
              print(f"ERROR: {term_path} already exists.", file=sys.stderr)
              sys.exit(1)

          SCHEME = "https://glossary.elhub.no/scheme/business-glossary"
          CONCEPT = f"https://glossary.elhub.no/concept/{slug}"

          lines = [
              '@prefix adms: <http://www.w3.org/ns/adms#> .',
              '@prefix elhub: <https://glossary.elhub.no/concept/> .',
              '@prefix skos: <http://www.w3.org/2004/02/skos/core#> .',
              '',
              f'elhub:{slug} a skos:Concept ;',
              f'    skos:notation "{slug}" ;',
          ]

          # prefLabels — @nn always required, even when identical to @no
          pref_labels = [f'"{en}"@en', f'"{no}"@no', f'"{nn or no}"@nn']
          lines.append('    skos:prefLabel ' + ',\n        '.join(pref_labels) + ' ;')

          # definitions
          defs = []
          if description_no:
              defs.append(f'"{description_no}"@no')
          if description_en:
              defs.append(f'"{description_en}"@en')
          if defs:
              lines.append('    skos:definition ' + ',\n        '.join(defs) + ' ;')

          # broader
          for parent in parents:
              lines.append(f'    skos:broader elhub:{parent} ;')

          lines.append(f'    skos:inScheme <{SCHEME}> ;')
          lines.append('    adms:status "active" .')
          lines.append('')

          content = '\n'.join(lines)

          # Validate that the generated Turtle is parseable before committing
          import rdflib
          try:
              rdflib.Graph().parse(data=content, format='turtle')
          except Exception as e:
              print(f"ERROR: generated Turtle is invalid — {e}", file=sys.stderr)
              sys.exit(1)

          with open(term_path, "w") as f:
              f.write(content)

          branch = f"new-term/{slug.lower()}-issue-{issue_n}"
          subprocess.run(["git", "config", "user.name",  "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "checkout", "-b", branch], check=True)
          subprocess.run(["git", "add", term_path], check=True)
          subprocess.run(["git", "commit", "-m", f"feat: add term {slug} (closes #{issue_n})"], check=True)
          subprocess.run(["git", "push", "origin", branch], check=True)

          pr_body = f"Adds **{slug}** as requested in #{issue_n}.\n\nPlease review the generated Turtle before merging."
          subprocess.run([
              "gh", "pr", "create",
              "--title", f"Add term: {slug}",
              "--body",  pr_body,
              "--head",  branch,
              "--base",  "main",
          ], check=True)

          print(f"PR created for {slug}.")
          PYEOF
