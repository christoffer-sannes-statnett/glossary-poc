name: Edit term — open PR

on:
  issues:
    types: [labeled]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  open-pr:
    if: github.event.label.name == 'edit-term'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Install rdflib
        run: pip install rdflib -q

      - name: Parse issue form and update term file
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          # GITHUB_TOKEN is used here for simplicity (PoC).
          # Limitation: the validate.yml check will NOT auto-trigger on the
          # auto-created PR — a reviewer must push a change or run it manually.
          # To fix this for production, replace with a GitHub App token:
          #   https://github.com/actions/create-github-app-token
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import os, re, sys
          import subprocess

          import rdflib
          from rdflib import Graph, Namespace, URIRef, Literal, RDF
          from rdflib.namespace import SKOS

          body     = os.environ["ISSUE_BODY"]
          issue_n  = os.environ["ISSUE_NUMBER"]

          def field(label):
              pattern = rf"###\s+{re.escape(label)}\s*\n+(.*?)(?=\n###|\Z)"
              m = re.search(pattern, body, re.DOTALL)
              val = m.group(1).strip() if m else ""
              return val if val and val != "_No response_" else ""

          slug = field("Slug").upper().replace(" ", "_")
          if not slug:
              print("ERROR: slug is required.", file=sys.stderr)
              sys.exit(1)

          term_path = f"terms/{slug}.ttl"
          if not os.path.exists(term_path):
              print(f"ERROR: {term_path} does not exist. Check the slug.", file=sys.stderr)
              sys.exit(1)

          ELHUB = Namespace("https://glossary.elhub.no/concept/")
          ADMS  = Namespace("http://www.w3.org/ns/adms#")
          concept = ELHUB[slug]

          g = Graph()
          g.parse(term_path, format="turtle")

          updates = {
              "en": field("Engelsk navn (la stå tomt for å beholde nåværende)"),
              "no": field("Bokmål (la stå tomt for å beholde nåværende)"),
              "nn": field("Nynorsk (la stå tomt for å beholde nåværende)"),
          }
          desc_no = field("Beskrivelse på norsk (la stå tomt for å beholde nåværende)")
          desc_en = field("Description in English (leave blank to keep current)")
          parents_raw = field("Overordnede begrep (la stå tomt for å beholde nåværende)")

          changed = []

          # Update prefLabels
          for lang, val in updates.items():
              if val:
                  # Remove existing label for this language
                  for obj in list(g.objects(concept, SKOS.prefLabel)):
                      if isinstance(obj, Literal) and obj.language == lang:
                          g.remove((concept, SKOS.prefLabel, obj))
                  g.add((concept, SKOS.prefLabel, Literal(val, lang=lang)))
                  changed.append(f"prefLabel@{lang}")

          # Update definitions
          if desc_no:
              for obj in list(g.objects(concept, SKOS.definition)):
                  if isinstance(obj, Literal) and obj.language == "no":
                      g.remove((concept, SKOS.definition, obj))
              g.add((concept, SKOS.definition, Literal(desc_no, lang="no")))
              changed.append("definition@no")
          if desc_en:
              for obj in list(g.objects(concept, SKOS.definition)):
                  if isinstance(obj, Literal) and obj.language == "en":
                      g.remove((concept, SKOS.definition, obj))
              g.add((concept, SKOS.definition, Literal(desc_en, lang="en")))
              changed.append("definition@en")

          # Update parents (skos:broader)
          if parents_raw:
              parents = [p.strip().upper() for p in parents_raw.split(",") if p.strip()]
              for obj in list(g.objects(concept, SKOS.broader)):
                  g.remove((concept, SKOS.broader, obj))
              for parent in parents:
                  g.add((concept, SKOS.broader, ELHUB[parent]))
              changed.append("broader")

          if not changed:
              print("No fields to update — all inputs were blank.", file=sys.stderr)
              sys.exit(1)

          g.serialize(destination=term_path, format="turtle")

          branch = f"edit-term/{slug.lower()}-issue-{issue_n}"
          subprocess.run(["git", "config", "user.name",  "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "checkout", "-b", branch], check=True)
          subprocess.run(["git", "add", term_path], check=True)
          subprocess.run(["git", "commit", "-m", f"fix: update term {slug} — {', '.join(changed)} (closes #{issue_n})"], check=True)
          subprocess.run(["git", "push", "origin", branch], check=True)

          pr_body = (
              f"Updates **{slug}** as requested in #{issue_n}.\n\n"
              f"Fields changed: {', '.join(f'`{c}`' for c in changed)}\n\n"
              "Please review before merging."
          )
          subprocess.run([
              "gh", "pr", "create",
              "--title", f"Edit term: {slug}",
              "--body",  pr_body,
              "--head",  branch,
              "--base",  "main",
          ], check=True)

          print(f"PR created for edits to {slug}.")
          PYEOF
